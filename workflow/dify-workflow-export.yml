    - data:
        code: "import json\n\n\ndef safe(value):\n    if value is None:\n        return\
          \ \"N/A\"\n    return str(value)\n\n\ndef main(company_list) -> dict:\n\
          \    success_items = []\n    failed_items = []\n\n    for item in company_list:\n\
          \        if item.get(\"status\") == \"failed\" or item.get(\"error\"):\n\
          \            failed_items.append(item)\n        else:\n            success_items.append(item)\n\
          \n    # 1. 数据获取状态表\n    status_table = \"| 股票代码 | 公司名称 | 数据状态 | 说明 |\\n\"\
          \n    status_table += \"|---|---|---|---|\\n\"\n\n    for item in success_items:\n\
          \        status_table += (\n            f\"| {safe(item.get('symbol'))}\
          \ \"\n            f\"| {safe(item.get('name'))} \"\n            f\"| 成功\
          \ \"\n            f\"| - |\\n\"\n        )\n\n    for item in failed_items:\n\
          \        status_table += (\n            f\"| {safe(item.get('symbol'))}\
          \ \"\n            f\"| {safe(item.get('name'))} \"\n            f\"| 失败\
          \ \"\n            f\"| {safe(item.get('error'))} |\\n\"\n        )\n\n \
          \   status_table += \"\\n\"\n\n    # 2. 公司概览表\n    overview_table = \"|\
          \ 公司名称 | 股票代码 | Sector | Industry | Market Cap | Revenue TTM | Latest Quarter\
          \ |\\n\"\n    overview_table += \"|---|---|---|---|---|---|---|\\n\"\n\n\
          \    if success_items:\n        for item in success_items:\n           \
          \ overview_table += (\n                f\"| {safe(item.get('name'))} \"\n\
          \                f\"| {safe(item.get('symbol'))} \"\n                f\"\
          | {safe(item.get('sector'))} \"\n                f\"| {safe(item.get('industry'))}\
          \ \"\n                f\"| {safe(item.get('market_cap'))} \"\n         \
          \       f\"| {safe(item.get('revenue_ttm'))} \"\n                f\"| {safe(item.get('latest_quarter'))}\
          \ |\\n\"\n            )\n    else:\n        overview_table += \"| 无成功数据\
          \ | - | - | - | - | - | - |\\n\"\n\n    overview_table += \"\\n\"\n\n  \
          \  # 3A. 估值与盈利能力表\n    valuation_profitability_table = (\n        \"| 股票代码\
          \ | PE Ratio | Forward PE | PEG Ratio | EPS | Profit Margin | \"\n     \
          \   \"Operating Margin | ROE | ROA |\\n\"\n    )\n    valuation_profitability_table\
          \ += \"|---|---:|---:|---:|---:|---:|---:|---:|---:|\\n\"\n\n    if success_items:\n\
          \        for item in success_items:\n            valuation_profitability_table\
          \ += (\n                f\"| {safe(item.get('symbol'))} \"\n           \
          \     f\"| {safe(item.get('pe_ratio'))} \"\n                f\"| {safe(item.get('forward_pe'))}\
          \ \"\n                f\"| {safe(item.get('peg_ratio'))} \"\n          \
          \      f\"| {safe(item.get('eps'))} \"\n                f\"| {safe(item.get('profit_margin'))}\
          \ \"\n                f\"| {safe(item.get('operating_margin'))} \"\n   \
          \             f\"| {safe(item.get('roe'))} \"\n                f\"| {safe(item.get('roa'))}\
          \ |\\n\"\n            )\n    else:\n        valuation_profitability_table\
          \ += \"| 无成功数据 | - | - | - | - | - | - | - | - |\\n\"\n\n    valuation_profitability_table\
          \ += \"\\n\"\n\n    # 3B. 成长性与波动表\n    growth_risk_table = (\n        \"\
          | 股票代码 | Revenue Growth YoY | Earnings Growth YoY | \"\n        \"52 Week\
          \ High | 52 Week Low | Beta |\\n\"\n    )\n    growth_risk_table += \"|---|---:|---:|---:|---:|---:|\\\
          n\"\n\n    if success_items:\n        for item in success_items:\n     \
          \       growth_risk_table += (\n                f\"| {safe(item.get('symbol'))}\
          \ \"\n                f\"| {safe(item.get('revenue_growth_yoy'))} \"\n \
          \               f\"| {safe(item.get('earnings_growth_yoy'))} \"\n      \
          \          f\"| {safe(item.get('week_52_high'))} \"\n                f\"\
          | {safe(item.get('week_52_low'))} \"\n                f\"| {safe(item.get('beta'))}\
          \ |\\n\"\n            )\n    else:\n        growth_risk_table += \"| 无成功数据\
          \ | - | - | - | - | - |\\n\"\n\n    growth_risk_table += \"\\n\"\n\n   \
          \ company_data_text = json.dumps(company_list, ensure_ascii=False, indent=2)\n\
          \n    return {\n        \"company_data_text\": company_data_text,\n    \
          \    \"status_table\": status_table,\n        \"overview_table\": overview_table,\n\
          \        \"valuation_profitability_table\": valuation_profitability_table,\n\
          \        \"growth_risk_table\": growth_risk_table,\n        \"success_count\"\
          : len(success_items),\n        \"failed_count\": len(failed_items)\n   \
          \ }"
