    - data:
        code: "import json\n\n\ndef to_float(value):\n    try:\n        if value in\
          \ [None, \"\", \"None\", \"N/A\", \"-\"]:\n            return None\n   \
          \     return float(value)\n    except Exception:\n        return None\n\n\
          \ndef format_large_number(value):\n    num = to_float(value)\n    if num\
          \ is None:\n        return \"N/A\"\n\n    if num >= 1_000_000_000_000:\n\
          \        return f\"{num / 1_000_000_000_000:.2f}T\"\n    elif num >= 1_000_000_000:\n\
          \        return f\"{num / 1_000_000_000:.2f}B\"\n    elif num >= 1_000_000:\n\
          \        return f\"{num / 1_000_000:.2f}M\"\n    else:\n        return str(num)\n\
          \n\ndef format_percent(value):\n    num = to_float(value)\n    if num is\
          \ None:\n        return \"N/A\"\n    return f\"{num * 100:.2f}%\"\n\n\n\
          def main(api_response: str, symbol: str) -> dict:\n    try:\n        data\
          \ = json.loads(api_response)\n    except Exception:\n        return {\n\
          \            \"company_data\": {\n                \"symbol\": symbol,\n\
          \                \"name\": \"N/A\",\n                \"status\": \"failed\"\
          ,\n                \"error\": \"Failed to parse API response body.\"\n \
          \           }\n        }\n\n    # Alpha Vantage 限流或额度提示\n    if isinstance(data,\
          \ dict) and \"Information\" in data:\n        return {\n            \"company_data\"\
          : {\n                \"symbol\": symbol,\n                \"name\": \"N/A\"\
          ,\n                \"status\": \"failed\",\n                \"error\": \"\
          Alpha Vantage API rate limit or daily quota reached.\"\n            }\n\
          \        }\n\n    # API 错误信息\n    if isinstance(data, dict) and \"Error\
          \ Message\" in data:\n        return {\n            \"company_data\": {\n\
          \                \"symbol\": symbol,\n                \"name\": \"N/A\"\
          ,\n                \"status\": \"failed\",\n                \"error\": data.get(\"\
          Error Message\", \"Invalid API call.\")\n            }\n        }\n\n  \
          \  # 没有有效 Symbol\n    if not data or \"Symbol\" not in data:\n        return\
          \ {\n            \"company_data\": {\n                \"symbol\": symbol,\n\
          \                \"name\": \"N/A\",\n                \"status\": \"failed\"\
          ,\n                \"error\": \"No valid company data returned from Alpha\
          \ Vantage.\"\n            }\n        }\n\n    company_data = {\n       \
          \ \"symbol\": data.get(\"Symbol\", symbol),\n        \"name\": data.get(\"\
          Name\", \"N/A\"),\n        \"status\": \"success\",\n        \"sector\"\
          : data.get(\"Sector\", \"N/A\"),\n        \"industry\": data.get(\"Industry\"\
          , \"N/A\"),\n        \"country\": data.get(\"Country\", \"N/A\"),\n    \
          \    \"currency\": data.get(\"Currency\", \"N/A\"),\n        \"latest_quarter\"\
          : data.get(\"LatestQuarter\", \"N/A\"),\n\n        \"market_cap\": format_large_number(data.get(\"\
          MarketCapitalization\")),\n        \"revenue_ttm\": format_large_number(data.get(\"\
          RevenueTTM\")),\n        \"gross_profit_ttm\": format_large_number(data.get(\"\
          GrossProfitTTM\")),\n        \"ebitda\": format_large_number(data.get(\"\
          EBITDA\")),\n\n        \"pe_ratio\": data.get(\"PERatio\", \"N/A\"),\n \
          \       \"forward_pe\": data.get(\"ForwardPE\", \"N/A\"),\n        \"peg_ratio\"\
          : data.get(\"PEGRatio\", \"N/A\"),\n        \"price_to_sales\": data.get(\"\
          PriceToSalesRatioTTM\", \"N/A\"),\n        \"price_to_book\": data.get(\"\
          PriceToBookRatio\", \"N/A\"),\n\n        \"eps\": data.get(\"EPS\", \"N/A\"\
          ),\n        \"profit_margin\": format_percent(data.get(\"ProfitMargin\"\
          )),\n        \"operating_margin\": format_percent(data.get(\"OperatingMarginTTM\"\
          )),\n        \"roe\": format_percent(data.get(\"ReturnOnEquityTTM\")),\n\
          \        \"roa\": format_percent(data.get(\"ReturnOnAssetsTTM\")),\n\n \
          \       \"revenue_growth_yoy\": format_percent(data.get(\"QuarterlyRevenueGrowthYOY\"\
          )),\n        \"earnings_growth_yoy\": format_percent(data.get(\"QuarterlyEarningsGrowthYOY\"\
          )),\n\n        \"analyst_target_price\": data.get(\"AnalystTargetPrice\"\
          , \"N/A\"),\n        \"analyst_rating_strong_buy\": data.get(\"AnalystRatingStrongBuy\"\
          , \"N/A\"),\n        \"analyst_rating_buy\": data.get(\"AnalystRatingBuy\"\
          , \"N/A\"),\n        \"analyst_rating_hold\": data.get(\"AnalystRatingHold\"\
          , \"N/A\"),\n        \"analyst_rating_sell\": data.get(\"AnalystRatingSell\"\
          , \"N/A\"),\n        \"analyst_rating_strong_sell\": data.get(\"AnalystRatingStrongSell\"\
          , \"N/A\"),\n\n        \"week_52_high\": data.get(\"52WeekHigh\", \"N/A\"\
          ),\n        \"week_52_low\": data.get(\"52WeekLow\", \"N/A\"),\n       \
          \ \"beta\": data.get(\"Beta\", \"N/A\"),\n\n        \"description\": data.get(\"\
          Description\", \"N/A\")[:600]\n    }\n\n    return {\n        \"company_data\"\
          : company_data\n    }"
        code_language: python3
