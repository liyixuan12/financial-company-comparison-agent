    - data:
        code: "import json\n\n\ndef to_float(value):\n    try:\n        if value in\
          \ [None, \"\", \"None\", \"N/A\", \"-\"]:\n            return None\n   \
          \     value = str(value).replace(\"%\", \"\").replace(\"T\", \"\").replace(\"\
          B\", \"\").replace(\"M\", \"\")\n        return float(value)\n    except\
          \ Exception:\n        return None\n\n\ndef normalize_positive(value, min_value,\
          \ max_value):\n    if value is None:\n        return 0\n    if max_value\
          \ == min_value:\n        return 50\n    score = (value - min_value) / (max_value\
          \ - min_value) * 100\n    return max(0, min(100, score))\n\n\ndef normalize_negative(value,\
          \ min_value, max_value):\n    if value is None:\n        return 0\n    if\
          \ max_value == min_value:\n        return 50\n    score = (max_value - value)\
          \ / (max_value - min_value) * 100\n    return max(0, min(100, score))\n\n\
          \ndef main(company_list) -> dict:\n    success_items = [\n        item for\
          \ item in company_list\n        if item.get(\"status\") == \"success\" and\
          \ not item.get(\"error\")\n    ]\n\n    if not success_items:\n        return\
          \ {\n            \"ranking_table\": \"没有成功获取数据的公司，无法生成研究优先级评分。\",\n    \
          \        \"scored_company_text\": \"[]\"\n        }\n\n    metrics = []\n\
          \    for item in success_items:\n        metrics.append({\n            \"\
          symbol\": item.get(\"symbol\"),\n            \"name\": item.get(\"name\"\
          ),\n            \"revenue_growth\": to_float(item.get(\"revenue_growth_yoy\"\
          )),\n            \"earnings_growth\": to_float(item.get(\"earnings_growth_yoy\"\
          )),\n            \"profit_margin\": to_float(item.get(\"profit_margin\"\
          )),\n            \"operating_margin\": to_float(item.get(\"operating_margin\"\
          )),\n            \"roe\": to_float(item.get(\"roe\")),\n            \"roa\"\
          : to_float(item.get(\"roa\")),\n            \"pe\": to_float(item.get(\"\
          pe_ratio\")),\n            \"forward_pe\": to_float(item.get(\"forward_pe\"\
          )),\n            \"peg\": to_float(item.get(\"peg_ratio\")),\n         \
          \   \"beta\": to_float(item.get(\"beta\"))\n        })\n\n    def get_range(key):\n\
          \        values = [m[key] for m in metrics if m[key] is not None]\n    \
          \    if not values:\n            return 0, 0\n        return min(values),\
          \ max(values)\n\n    ranges = {\n        key: get_range(key)\n        for\
          \ key in [\n            \"revenue_growth\",\n            \"earnings_growth\"\
          ,\n            \"profit_margin\",\n            \"operating_margin\",\n \
          \           \"roe\",\n            \"roa\",\n            \"pe\",\n      \
          \      \"forward_pe\",\n            \"peg\",\n            \"beta\"\n   \
          \     ]\n    }\n\n    scored = []\n\n    for item, m in zip(success_items,\
          \ metrics):\n        growth_score = (\n            normalize_positive(m[\"\
          revenue_growth\"], *ranges[\"revenue_growth\"]) * 0.5 +\n            normalize_positive(m[\"\
          earnings_growth\"], *ranges[\"earnings_growth\"]) * 0.5\n        )\n\n \
          \       profitability_score = (\n            normalize_positive(m[\"profit_margin\"\
          ], *ranges[\"profit_margin\"]) * 0.3 +\n            normalize_positive(m[\"\
          operating_margin\"], *ranges[\"operating_margin\"]) * 0.3 +\n          \
          \  normalize_positive(m[\"roe\"], *ranges[\"roe\"]) * 0.2 +\n          \
          \  normalize_positive(m[\"roa\"], *ranges[\"roa\"]) * 0.2\n        )\n\n\
          \        valuation_score = (\n            normalize_negative(m[\"pe\"],\
          \ *ranges[\"pe\"]) * 0.35 +\n            normalize_negative(m[\"forward_pe\"\
          ], *ranges[\"forward_pe\"]) * 0.35 +\n            normalize_negative(m[\"\
          peg\"], *ranges[\"peg\"]) * 0.30\n        )\n\n        risk_score = normalize_negative(m[\"\
